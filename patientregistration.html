
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏥 Patient Management System</h1>
        <p>Manage patient records easily</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Add New Patient</h2>

            <form id="patientForm">
                <label for="name">Patient Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>

                <label for="age">Age</label>
                <input type="number" id="age" min="0" max="120"
                       placeholder="Enter age" required>

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <label for="disease">Disease / Health Concern</label>
                <input type="text" id="disease"
                       placeholder="Enter health concern" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" pattern="[0-9]{10}"
                       maxlength="10" placeholder="10-digit number" required>

                <button type="submit">Add Patient</button>
            </form>
        </section>

        <section class="records-section">
            <h2>Patient Records</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Health Concern</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="patientList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
